[package]
name = "polestar-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Cameron Durham <u64.cam@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A lightweight Rust wrapper for the Polestar vehicle GraphQL API"
repository = "https://github.com/camerondurham/polestar-api-rs"
documentation = "https://docs.rs/polestar-api"
homepage = "https://github.com/camerondurham/polestar-api-rs"
keywords = ["polestar", "api", "vehicle", "telemetry", "graphql"]
categories = ["api-bindings"]
readme = "README.md"
exclude = [
    ".env",
    "docs/",
]

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time"] }

# HTTP client
reqwest = { version = "0.13", features = ["cookies", "form", "json", "query", "rustls"], default-features = false }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# DateTime handling
chrono = { version = "0.4", features = ["serde"] }

# Auth dependencies
base64 = "0.22"
sha2 = "0.10"
rand = "0.10"
regex = "1.13"
zeroize = "1.8"

# Optional: Caching (feature-gated)
moka = { version = "0.12", features = ["future"], optional = true }

# Environment variables
dotenvy = "0.15"

[build-dependencies]
# None for now

[[example]]
name = "test_harness"
required-features = ["cli"]

[[example]]
name = "basic_telemetry"

[[example]]
name = "vehicle_info"

[[example]]
name = "graphql_introspection"

[[example]]
name = "verbose_vehicle_info"

[[bin]]
name = "polestar"
path = "src/bin/polestar.rs"
required-features = ["cli"]

[features]
default = []
cache = ["moka"]
cli = ["clap", "env_logger"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[dependencies.clap]
version = "4.6"
features = ["derive", "env"]
optional = true

[dependencies.env_logger]
version = "0.11"
optional = true
