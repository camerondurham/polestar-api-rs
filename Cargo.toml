[package]
name = "polestar-api"
version = "0.1.0"
edition = "2021"
authors = ["Cameron Durham <u64.cam@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A lightweight Rust wrapper for the Polestar vehicle GraphQL API"
repository = "https://github.com/camerondurham/polestar-api-rs"
documentation = "https://docs.rs/polestar-api"
homepage = "https://github.com/camerondurham/polestar-api-rs"
keywords = ["polestar", "api", "vehicle", "telemetry", "graphql"]
categories = ["api-bindings"]
readme = "README.md"
exclude = [
    ".env",
    ".env.*",
    "docs/",
]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls", "cookies"], default-features = false }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# DateTime handling
chrono = { version = "0.4", features = ["serde"] }

# Auth dependencies
base64 = "0.21"
sha2 = "0.10"
rand = "0.8"
regex = "1.10"

# Optional: Caching (feature-gated)
moka = { version = "0.12", features = ["future"], optional = true }

[dev-dependencies]
# Testing
tokio-test = "0.4"
wiremock = "0.6"
mockito = "1.2"

# Test utilities
futures = "0.3"

[build-dependencies]
# None for now

[[example]]
name = "test_harness"
required-features = ["cli"]

[[example]]
name = "basic_telemetry"

[[example]]
name = "vehicle_info"

[features]
default = []
cache = ["moka"]
cli = ["clap", "env_logger"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[dependencies.clap]
version = "4.4"
features = ["derive", "env"]
optional = true

[dependencies.env_logger]
version = "0.11"
optional = true
